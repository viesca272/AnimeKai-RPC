<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeKai RPC V6</title>
<style>
:root{--accent:#8b5cf6;--bg:#0c0b12;--card:#16131d;--text:#f6f2ff;--muted:#a8a0b4;--border:#30293a;color-scheme:dark}*{box-sizing:border-box}body{margin:0;width:420px;background:var(--bg);color:var(--text);font:13px "Segoe UI",sans-serif}.wrap{padding:15px}.top{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:24px;font-weight:800}.title{font-size:19px;font-weight:800}.muted{color:var(--muted)}.credit{margin-left:auto;text-align:right;font-size:10px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:11px}.status{display:flex;align-items:center;gap:8px;margin-top:12px}.dot{width:9px;height:9px;border-radius:50%;background:#777}.good{background:#43d38b}.warn{background:#f3b657}.bad{background:#ff6679}.media{display:flex;gap:11px}.cover{width:76px;height:106px;border-radius:9px;background:#24202d;object-fit:cover}.name{font-size:15px;font-weight:700}.bar{height:5px;background:#302b38;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--accent);width:0}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.btn{border:1px solid var(--border);background:#27222f;color:var(--text);border-radius:9px;padding:9px 11px;cursor:pointer}.primary{background:var(--accent);border-color:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{background:#0e0c13;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px;width:100%}label{font-size:11px;color:var(--muted)}.diag{font-size:11px;line-height:1.6}.repairResult{font-size:11px;color:var(--muted);margin-top:8px}.footer{text-align:center;color:#766e82;font-size:10px;margin-top:12px}</style></head><body><div class="wrap">
<div class="top"><div class="logo">A</div><div><div class="title">AnimeKai RPC V6</div><div class="muted">Alpha 1</div></div><div class="credit">Made by<br><b>viesca27</b></div></div>
<div class="status"><span id="dot" class="dot"></span><span id="statusText">Connecting…</span></div>
<div class="card media"><img id="cover" class="cover" alt=""><div style="flex:1"><div id="anime" class="name">Nothing detected</div><div id="episode" class="muted">—</div><div id="playback" class="muted">—</div><div id="time" style="margin-top:9px">00:00 / 00:00</div><div class="bar"><div id="fill" class="fill"></div></div></div></div>
<div class="card"><div class="row between"><b>Appearance</b><span class="muted">Live preview</span></div><div class="row" style="margin-top:10px"><input id="accent" type="color" value="#8b5cf6"><input id="hex" class="field" value="#8b5cf6"><select id="theme" class="field"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></div><div class="row" style="margin-top:8px"><label><input id="compact" type="checkbox"> Compact layout</label><label><input id="reduced" type="checkbox"> Reduced motion</label></div></div>
<div class="card"><div class="row between"><b>Repair App</b><span id="repairState" class="muted">Ready</span></div><div class="grid" style="margin-top:9px"><button id="health" class="btn">Run health check</button><button id="repair" class="btn primary">Repair App</button></div><div id="repairResult" class="repairResult">Checks the helper, Native Messaging registration, browser bridge, Discord connection, and local config.</div></div>
<div class="card diag" id="diag">Loading diagnostics…</div>
<div class="grid" style="margin-top:10px"><button id="test" class="btn primary">Test RPC</button><button id="copy" class="btn">Copy diagnostics</button><button id="open" class="btn">Open AnimeKai</button><button id="clear" class="btn">Clear activity</button></div>
<div class="footer">AnimeKai RPC 6.0.0-alpha.1 • Made by viesca27</div></div><script src="popup.js"></script></body></html>
