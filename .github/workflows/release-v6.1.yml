name: Publish V6.1 Stable

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v6.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate V6.1 extension
        shell: pwsh
        run: |
          node --check src/v6/extension/background.js
          node --check src/v6/extension/content.js
          node --check src/v6/extension/popup.js
          node --check src/v6/extension/onboarding.js

          $manifest = Get-Content src/v6/extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version_name -ne "6.1.6") { throw "Manifest version_name is not V6.1.6." }
          if ($manifest.host_permissions -contains "<all_urls>") { throw "<all_urls> must not be a required V6.1 host permission." }
          if ($manifest.optional_host_permissions -notcontains "<all_urls>") { throw "Optional player-frame permission is missing." }

          $content = Get-Content src/v6/extension/content.js -Raw
          if ($content -notmatch 'kind: "browsing"') { throw "Browsing presence detector is missing." }
          if ($content -notmatch 'queueBurst') { throw "Fast startup burst detection is missing." }

          $background = Get-Content src/v6/extension/background.js -Raw
          if ($background -notmatch 'const VERSION = "6\.1\.6"') { throw "Extension background version is not V6.1.6." }
          if ($background -notmatch 'BROWSING_ARTWORK_URLS') { throw "Browsing artwork map is missing." }
          if ($background -notmatch 'AnimeKai-Browsing-Square-512x512\.png') { throw "Square PNG browsing artwork is not configured." }
          if ($background -match 'AnimeKai-Browsing-[^"]+\.jpg') { throw "Legacy JPEG browsing artwork reference is still present." }
          if (!(Test-Path "src/v6/extension/assets/animekai-clean.webp.b64")) { throw "Clean AnimeKai artwork seed is missing." }
          if ($background -notmatch 'Checking system health') { throw "Improved health-check state is missing." }
          if ($background -notmatch 'runAt: "document_start"') { throw "Dynamic player detector is not starting early." }

          $popup = Get-Content src/v6/extension/popup.js -Raw
          if ($popup -notmatch 'assets/rpc/AnimeKai-Browsing-Square-512x512\.png') { throw "Popup is not using packaged browsing artwork." }
          if ($popup -notmatch 'Native Messaging manifest') { throw "Detailed health results are missing from popup." }

          foreach($icon in @("icon16.png","icon32.png","icon48.png","icon128.png")) {
            if (!(Test-Path "src/v6/extension/icons/$icon")) { throw "Missing extension icon: $icon" }
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate desktop helper
        shell: pwsh
        run: |
          python -m py_compile src/v6/native_host/native_host.py
          $text = Get-Content src/v6/native_host/native_host.py -Raw
          if ($text -notmatch 'HOST_VERSION = "6\.1\.6"') { throw "Native helper version is not V6.1.6." }
          if ($text -notmatch 'HELPER_CHANNEL = "stable"') { throw "Native helper is not marked stable." }
          if ($text -notmatch 'PROTOCOL_VERSION = 3') { throw "Native helper protocol is not V6.1." }
          if ($text -notmatch 'BROWSING_ARTWORK_URLS') { throw "Native browsing artwork fallbacks are missing." }
          if ($text -notmatch 'AnimeKai-Browsing-Square-512x512\.png') { throw "Native square browsing artwork is missing." }
          if ($text -notmatch 'AnimeKai-Browsing-2x1-1280x640\.png') { throw "Native wide PNG fallback is missing." }
          if ($text -match 'AnimeKai-Browsing-[^"]+\.jpg') { throw "Native helper still references legacy JPEG browsing artwork." }
          if ($text -notmatch 'PLAY_ICON_URL') { throw "Playing RPC badge is missing." }
          if ($text -notmatch 'PAUSE_ICON_URL') { throw "Paused RPC badge is missing." }
          if ($text -notmatch '"small_image": playback_icon') { throw "Dynamic playback badge wiring is missing." }
          if ($text -notmatch 'installation_ok') { throw "Detailed health validation is missing." }
          if ($text -notmatch '1543575455523807385') { throw "Bundled Discord Application ID is missing." }

      - name: Install native-host build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10,<12" "pypresence==4.6.2" "pyinstaller>=6.15,<7"

      - name: Generate clean Discord artwork
        shell: pwsh
        run: |
          @'
          import base64, io
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter, ImageEnhance, ImageDraw

          seed_file = Path("src/v6/extension/assets/animekai-clean.webp.b64")
          package_dir = Path("src/v6/extension/assets/rpc")
          release_dir = Path("release-artwork")
          package_dir.mkdir(parents=True, exist_ok=True)
          release_dir.mkdir(parents=True, exist_ok=True)

          raw = base64.b64decode(seed_file.read_text(encoding="utf-8").strip())
          src = Image.open(io.BytesIO(raw)).convert("RGB")
          if src.width < 100 or src.height < 100:
              raise RuntimeError("Clean AnimeKai artwork seed is unexpectedly small.")

          # IMPORTANT: no color-keying, alpha extraction, progressive JPEG,
          # or reconstruction of the source art. V6.1.6 uses the clean icon
          # directly so the black/static corruption cannot be introduced here.
          def save_png(image, name):
              for destination in (package_dir / name, release_dir / name):
                  image.save(destination, "PNG", optimize=True)

          for size in (512, 1024):
              image = src.resize((size, size), Image.Resampling.LANCZOS)
              save_png(image, f"AnimeKai-Browsing-Square-{size}x{size}.png")

          def wide_variant(width, height):
              background = ImageOps.fit(src, (width, height), method=Image.Resampling.LANCZOS)
              background = background.filter(ImageFilter.GaussianBlur(radius=max(8, min(width, height)//30)))
              background = ImageEnhance.Brightness(background).enhance(0.95)
              icon_h = round(height * 0.78)
              icon = src.resize((icon_h, icon_h), Image.Resampling.LANCZOS)
              background.paste(icon, ((width-icon_h)//2, (height-icon_h)//2))
              return background

          variants = [
              ("AnimeKai-Browsing-4x3-512x384.png", 512, 384),
              ("AnimeKai-Browsing-4x3-1024x768.png", 1024, 768),
              ("AnimeKai-Browsing-16x9-640x360.png", 640, 360),
              ("AnimeKai-Browsing-16x9-1280x720.png", 1280, 720),
              ("AnimeKai-Browsing-2x1-640x320.png", 640, 320),
              ("AnimeKai-Browsing-2x1-1280x640.png", 1280, 640),
          ]
          for name, width, height in variants:
              save_png(wide_variant(width, height), name)

          # Playback-state badges for the small Rich Presence overlay.
          for name, paused in (
              ("AnimeKai-Playback-Play-256x256.png", False),
              ("AnimeKai-Playback-Pause-256x256.png", True),
          ):
              badge = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
              draw = ImageDraw.Draw(badge)
              draw.ellipse((12, 12, 244, 244), fill=(0, 0, 0, 255))
              if paused:
                  draw.rounded_rectangle((78, 62, 112, 194), radius=8, fill=(255, 255, 255, 255))
                  draw.rounded_rectangle((144, 62, 178, 194), radius=8, fill=(255, 255, 255, 255))
              else:
                  draw.polygon(((92, 62), (92, 194), (190, 128)), fill=(255, 255, 255, 255))
              save_png(badge, name)

          expected = {
              "AnimeKai-Browsing-Square-512x512.png": (512, 512),
              "AnimeKai-Browsing-Square-1024x1024.png": (1024, 1024),
              "AnimeKai-Browsing-4x3-512x384.png": (512, 384),
              "AnimeKai-Browsing-4x3-1024x768.png": (1024, 768),
              "AnimeKai-Browsing-16x9-640x360.png": (640, 360),
              "AnimeKai-Browsing-16x9-1280x720.png": (1280, 720),
              "AnimeKai-Browsing-2x1-640x320.png": (640, 320),
              "AnimeKai-Browsing-2x1-1280x640.png": (1280, 640),
              "AnimeKai-Playback-Play-256x256.png": (256, 256),
              "AnimeKai-Playback-Pause-256x256.png": (256, 256),
          }
          for name, size in expected.items():
              path = release_dir / name
              with Image.open(path) as check:
                  check.load()
                  if check.size != size or check.format != "PNG":
                      raise RuntimeError(f"{name}: invalid generated asset")
              print(f"{name}: {size[0]}x{size[1]} PNG")
          '@ | python -

      - name: Build desktop helper
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --console --name AnimeKaiRPCNativeHost src/v6/native_host/native_host.py
          if (!(Test-Path "dist/AnimeKaiRPCNativeHost.exe")) { throw "Native helper build failed." }

      - name: Package V6.1.6
        shell: pwsh
        run: |
          $out = "release"
          $stage = Join-Path $out "AnimeKai-RPC-V6.1.6"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "native_host") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "windows") | Out-Null

          Copy-Item "src/v6/extension" (Join-Path $stage "extension") -Recurse
          Copy-Item "dist/AnimeKaiRPCNativeHost.exe" (Join-Path $stage "native_host/AnimeKaiRPCNativeHost.exe")
          Copy-Item "src/v6/windows/Install-Helper.ps1" (Join-Path $stage "windows/Install-Helper.ps1")
          Copy-Item "docs/V6_1_6_RELEASE_NOTES.md" (Join-Path $stage "README.md")
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE") -ErrorAction SilentlyContinue

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0windows\Install-Helper.ps1"' | Set-Content (Join-Path $stage "Install AnimeKai RPC.cmd") -Encoding ASCII

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0windows\Install-Helper.ps1" -Repair' | Set-Content (Join-Path $stage "Repair AnimeKai RPC.cmd") -Encoding ASCII

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference=''SilentlyContinue''; $n=''com.animekai.discordrpc''; foreach($b in @(''HKCU:\Software\Google\Chrome\NativeMessagingHosts'',''HKCU:\Software\Chromium\NativeMessagingHosts'',''HKCU:\Software\Microsoft\Edge\NativeMessagingHosts'')){Remove-Item ($b+''\''+$n) -Recurse -Force}; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\AnimeKaiRPCNativeHost.exe'') -Force; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\com.animekai.discordrpc.json'') -Force; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\install-info.json'') -Force"' | Set-Content (Join-Path $stage "Uninstall AnimeKai RPC.cmd") -Encoding ASCII

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $out "AnimeKai-RPC-V6.1.6-Windows.zip") -CompressionLevel Optimal
          Compress-Archive -Path "src/v6/extension/*" -DestinationPath (Join-Path $out "AnimeKai-RPC-V6.1.6-Extension.zip") -CompressionLevel Optimal

          Get-FileHash (Join-Path $out "AnimeKai-RPC-V6.1.6-Windows.zip") -Algorithm SHA256 | Format-List
          Get-FileHash (Join-Path $out "AnimeKai-RPC-V6.1.6-Extension.zip") -Algorithm SHA256 | Format-List

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v6.1.6"
          $windows = "release/AnimeKai-RPC-V6.1.6-Windows.zip"
          $extension = "release/AnimeKai-RPC-V6.1.6-Extension.zip"
          $artwork = @(
            "release-artwork/AnimeKai-Browsing-Square-512x512.png",
            "release-artwork/AnimeKai-Browsing-Square-1024x1024.png",
            "release-artwork/AnimeKai-Browsing-4x3-512x384.png",
            "release-artwork/AnimeKai-Browsing-4x3-1024x768.png",
            "release-artwork/AnimeKai-Browsing-16x9-640x360.png",
            "release-artwork/AnimeKai-Browsing-16x9-1280x720.png",
            "release-artwork/AnimeKai-Browsing-2x1-640x320.png",
            "release-artwork/AnimeKai-Browsing-2x1-1280x640.png",
            "release-artwork/AnimeKai-Playback-Play-256x256.png",
            "release-artwork/AnimeKai-Playback-Pause-256x256.png"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $windows $extension @artwork --clobber
            gh release edit $tag --title "AnimeKai RPC V6.1.6" --notes-file "docs/V6_1_6_RELEASE_NOTES.md" --prerelease=false --latest
          } else {
            gh release create $tag $windows $extension @artwork --target $env:GITHUB_SHA --title "AnimeKai RPC V6.1.6" --notes-file "docs/V6_1_6_RELEASE_NOTES.md" --latest
          }
