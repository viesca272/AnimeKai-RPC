name: Publish V6 Alpha 1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v6-alpha1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native-host build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pypresence==4.6.2" "pyinstaller>=6.15,<7"

      - name: Build native helper
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --console --name AnimeKaiRPCNativeHost src/v6/native_host/native_host.py
          if (!(Test-Path "dist/AnimeKaiRPCNativeHost.exe")) { throw "Native helper build failed." }

      - name: Package V6 Alpha 1
        shell: pwsh
        run: |
          $version = "6.0.0-alpha.1"
          $out = "release"
          $stage = Join-Path $out "AnimeKai-RPC-V6.0.0-alpha.1"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "native_host") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "windows") | Out-Null

          Copy-Item "src/v6/extension" (Join-Path $stage "extension") -Recurse
          Copy-Item "dist/AnimeKaiRPCNativeHost.exe" (Join-Path $stage "native_host/AnimeKaiRPCNativeHost.exe")
          Copy-Item "src/v6/windows/Install-Helper.ps1" (Join-Path $stage "windows/Install-Helper.ps1")
          Copy-Item "docs/V6_ALPHA1_RELEASE_NOTES.md" (Join-Path $stage "README.md")
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE") -ErrorAction SilentlyContinue

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0windows\Install-Helper.ps1"' | Set-Content (Join-Path $stage "Install AnimeKai RPC.cmd") -Encoding ASCII

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0windows\Install-Helper.ps1" -Repair' | Set-Content (Join-Path $stage "Repair AnimeKai RPC.cmd") -Encoding ASCII

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference=''SilentlyContinue''; $n=''com.animekai.discordrpc''; foreach($b in @(''HKCU:\Software\Google\Chrome\NativeMessagingHosts'',''HKCU:\Software\Chromium\NativeMessagingHosts'',''HKCU:\Software\Microsoft\Edge\NativeMessagingHosts'')){Remove-Item ($b+''\''+$n) -Recurse -Force}; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\AnimeKaiRPCNativeHost.exe'') -Force; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\com.animekai.discordrpc.json'') -Force"' | Set-Content (Join-Path $stage "Uninstall AnimeKai RPC.cmd") -Encoding ASCII

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $out "AnimeKai-RPC-V6.0.0-alpha.1-Windows.zip") -CompressionLevel Optimal
          Compress-Archive -Path "src/v6/extension/*" -DestinationPath (Join-Path $out "AnimeKai-RPC-V6.0.0-alpha.1-Extension.zip") -CompressionLevel Optimal

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v6.0.0-alpha.1"
          $windows = "release/AnimeKai-RPC-V6.0.0-alpha.1-Windows.zip"
          $extension = "release/AnimeKai-RPC-V6.0.0-alpha.1-Extension.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $windows $extension --clobber
            gh release edit $tag --title "AnimeKai RPC V6 Alpha 1" --notes-file "docs/V6_ALPHA1_RELEASE_NOTES.md" --prerelease
          } else {
            gh release create $tag $windows $extension --target $env:GITHUB_SHA --title "AnimeKai RPC V6 Alpha 1" --notes-file "docs/V6_ALPHA1_RELEASE_NOTES.md" --prerelease
          }
