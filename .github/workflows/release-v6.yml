name: Publish V6 Stable

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate V6 extension
        shell: pwsh
        run: |
          node --check src/v6/extension/background.js
          node --check src/v6/extension/content.js
          node --check src/v6/extension/popup.js
          node --check src/v6/extension/onboarding.js

          $manifest = Get-Content src/v6/extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version_name -ne "6.0.0") { throw "Manifest version_name is not V6.0.0." }
          if ($manifest.host_permissions -contains "<all_urls>") { throw "<all_urls> must not be a required V6 host permission." }
          if ($manifest.optional_host_permissions -notcontains "<all_urls>") { throw "Optional player-frame permission is missing." }

          $background = Get-Content src/v6/extension/background.js -Raw
          if ($background -notmatch 'const VERSION = "6\.0\.0"') { throw "Extension background version is not V6.0.0." }
          if ($background -notmatch 'backgroundGradient') { throw "Gradient appearance settings are missing." }

          $popup = Get-Content src/v6/extension/popup.js -Raw
          foreach($preset in @("AnimeKai Aurora","Borealis","Charcoal","Midnight","Sakura","Ember")) {
            if ($popup -notmatch [regex]::Escape($preset)) { throw "Missing gradient preset: $preset" }
          }

          foreach($icon in @("icon16.png","icon32.png","icon48.png","icon128.png")) {
            if (!(Test-Path "src/v6/extension/icons/$icon")) { throw "Missing extension icon: $icon" }
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate desktop helper
        shell: pwsh
        run: |
          python -m py_compile src/v6/native_host/native_host.py
          $text = Get-Content src/v6/native_host/native_host.py -Raw
          if ($text -notmatch 'HOST_VERSION = "6\.0\.0"') { throw "Native helper version is not V6.0.0." }
          if ($text -notmatch 'HELPER_CHANNEL = "stable"') { throw "Native helper is not marked stable." }
          if ($text -notmatch 'PROTOCOL_VERSION = 2') { throw "Native helper protocol version is missing." }
          if ($text -notmatch '1543575455523807385') { throw "Bundled Discord Application ID is missing." }

      - name: Install native-host build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pypresence==4.6.2" "pyinstaller>=6.15,<7"

      - name: Build desktop helper
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --console --name AnimeKaiRPCNativeHost src/v6/native_host/native_host.py
          if (!(Test-Path "dist/AnimeKaiRPCNativeHost.exe")) { throw "Native helper build failed." }

      - name: Package V6.0.0
        shell: pwsh
        run: |
          $out = "release"
          $stage = Join-Path $out "AnimeKai-RPC-V6.0.0"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "native_host") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "windows") | Out-Null

          Copy-Item "src/v6/extension" (Join-Path $stage "extension") -Recurse
          Copy-Item "dist/AnimeKaiRPCNativeHost.exe" (Join-Path $stage "native_host/AnimeKaiRPCNativeHost.exe")
          Copy-Item "src/v6/windows/Install-Helper.ps1" (Join-Path $stage "windows/Install-Helper.ps1")
          Copy-Item "docs/V6_RELEASE_NOTES.md" (Join-Path $stage "README.md")
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE") -ErrorAction SilentlyContinue

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0windows\Install-Helper.ps1"' | Set-Content (Join-Path $stage "Install AnimeKai RPC.cmd") -Encoding ASCII

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0windows\Install-Helper.ps1" -Repair' | Set-Content (Join-Path $stage "Repair AnimeKai RPC.cmd") -Encoding ASCII

          '@echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference=''SilentlyContinue''; $n=''com.animekai.discordrpc''; foreach($b in @(''HKCU:\Software\Google\Chrome\NativeMessagingHosts'',''HKCU:\Software\Chromium\NativeMessagingHosts'',''HKCU:\Software\Microsoft\Edge\NativeMessagingHosts'')){Remove-Item ($b+''\''+$n) -Recurse -Force}; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\AnimeKaiRPCNativeHost.exe'') -Force; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\com.animekai.discordrpc.json'') -Force; Remove-Item (Join-Path $env:LOCALAPPDATA ''AnimeKaiRPC\install-info.json'') -Force"' | Set-Content (Join-Path $stage "Uninstall AnimeKai RPC.cmd") -Encoding ASCII

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $out "AnimeKai-RPC-V6.0.0-Windows.zip") -CompressionLevel Optimal
          Compress-Archive -Path "src/v6/extension/*" -DestinationPath (Join-Path $out "AnimeKai-RPC-V6.0.0-Extension.zip") -CompressionLevel Optimal

          Get-FileHash (Join-Path $out "AnimeKai-RPC-V6.0.0-Windows.zip") -Algorithm SHA256 | Format-List
          Get-FileHash (Join-Path $out "AnimeKai-RPC-V6.0.0-Extension.zip") -Algorithm SHA256 | Format-List

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v6.0.0"
          $windows = "release/AnimeKai-RPC-V6.0.0-Windows.zip"
          $extension = "release/AnimeKai-RPC-V6.0.0-Extension.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $windows $extension --clobber
            gh release edit $tag --title "AnimeKai RPC V6.0.0" --notes-file "docs/V6_RELEASE_NOTES.md" --prerelease=false --latest
          } else {
            gh release create $tag $windows $extension --target $env:GITHUB_SHA --title "AnimeKai RPC V6.0.0" --notes-file "docs/V6_RELEASE_NOTES.md" --latest
          }
